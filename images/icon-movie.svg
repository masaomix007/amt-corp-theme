<?xml version="1.0" encoding="UTF-8"?>
<svg id="layer_video" xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 88.74 64.7">
  <defs>
    <style>
      /* Animation Definition */
      @keyframes drawAndFillVideo {
        0% {
          stroke-dashoffset: 1000;
          fill-opacity: 0;
        }
        60% {
          stroke-dashoffset: 0;
          fill-opacity: 0;
        }
        100% {
          stroke-dashoffset: 0;
          fill-opacity: 1;
          stroke-opacity: 0;
        }
      }

      /* Common styles */
      .video-anim {
        fill: #3e3a39;
        stroke: #3e3a39;
        stroke-width: 0.5px;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 1000;
        stroke-dashoffset: 1000;
        fill-opacity: 0;
        
        /* Duration set to 2.0s */
        animation: drawAndFillVideo 2.0s cubic-bezier(0.55, 0.055, 0.675, 0.19) forwards;
      }
      
      /* No delays */
    </style>
  </defs>

